# Publishes Insights that are queued on the "scheduled" branch.
#
# Each folder in scheduled-releases/ on the "scheduled" branch is named
# with its publication date (YYYY-MM-DD). Every morning this workflow
# copies any folder whose date has arrived (UK time) into the site on
# main, refreshes the "Latest insights" block on the home page,
# commits and pushes. GitHub Pages then rebuilds, and the
# "Notify Bing of changed pages" workflow submits the new pages.
#
# Queued articles are not on the website until their date. They are
# visible on GitHub to anyone who opens the "scheduled" branch.
#
# To publish early, open the Actions tab, choose
# "Publish scheduled Insights" and click "Run workflow".

name: Publish scheduled Insights

on:
  schedule:
    - cron: "17 9 * * *"   # 09:17 UTC daily (09:17 UK time in winter)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-scheduled
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Fetch the queue
        id: queue
        run: |
          if ! git fetch --depth=1 origin scheduled; then
            echo "No scheduled branch, nothing to do."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git worktree add -B scheduled "$RUNNER_TEMP/queue" FETCH_HEAD
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Apply releases that are due
        id: apply
        if: steps.queue.outputs.found == 'true'
        run: |
          today=$(TZ=Europe/London date +%F)
          echo "Today (UK): $today"
          q="$RUNNER_TEMP/queue/scheduled-releases"
          applied=""
          if [ -d "$q" ]; then
            for dir in $(ls -d "$q"/*/ 2>/dev/null | sort); do
              d=$(basename "$dir")
              [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || continue
              if [[ "$d" > "$today" ]]; then
                echo "Waiting: $d"
                continue
              fi
              # Releases are cumulative and applied in date order.
              cp -a "$dir". .
              applied="$applied $d"
            done
          fi
          if [ -z "$applied" ]; then
            echo "Nothing due today."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Refresh the "Latest insights" block on the home page.
          python3 .github/scripts/latest_insights.py
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish scheduled Insights:$applied"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          # Remove published releases from the queue so they are never
          # copied again (later edits on main are then left alone).
          cd "$RUNNER_TEMP/queue"
          for d in $applied; do git rm -r -q "scheduled-releases/$d"; done
          git commit -m "Published:$applied"
          git push origin scheduled

      - name: Ask GitHub Pages to rebuild
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request not needed or already queued."
